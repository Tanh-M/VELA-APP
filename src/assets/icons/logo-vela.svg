<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Vela" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Dégradé du bouclier : bleu clair en haut, bleu profond en bas -->
    <linearGradient id="vela-shield" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#63B5F2"/>
      <stop offset="1" stop-color="#14529A"/>
    </linearGradient>
    <!-- Dégradé de la flamme : blanc chaud vers blanc bleuté -->
    <linearGradient id="vela-flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D6E9FA"/>
    </linearGradient>
  </defs>

  <!-- Bouclier -->
  <path d="M60 7 L103 21 V57 C103 86 85 105 60 115 C35 105 17 86 17 57 V21 Z" fill="url(#vela-shield)"/>
  <!-- Fin liseré intérieur -->
  <path d="M60 14 L96 26 V57 C96 81 81 98 60 107 C39 98 24 81 24 57 V26 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.5"/>

  <!-- Flamme -->
  <path d="M60 28 C63 41 78 47 78 65 C78 78 70 88 60 90 C50 88 42 78 42 65 C42 56 47 51 52 45 C52.5 52 56 55 58.5 55 C61 46 57 37 60 28 Z" fill="url(#vela-flame)"/>
  <!-- Cœur de la flamme (la partie bleue au centre) -->
  <path d="M60 61 C61.5 68 69 71 69 78 C69 83.5 64.5 87 60 87 C55.5 87 51 83.5 51 78 C51 71 58.5 68 60 61 Z" fill="#1F6DB8"/>
</svg>
